    <g fill="#4c2a7d" opacity=".55">
      <rect x="0" y="470" width="140" height="7" rx="3"/><rect x="162" y="470" width="140" height="7" rx="3"/>
      <rect x="324" y="470" width="140" height="7" rx="3"/><rect x="486" y="470" width="140" height="7" rx="3"/>
      <rect x="648" y="470" width="140" height="7" rx="3"/><rect x="810" y="470" width="140" height="7" rx="3"/>
    </g>
    <g fill="#150a26">
      <rect x="140" y="470" width="12" height="104"/><rect x="302" y="470" width="12" height="104"/>
      <rect x="464" y="470" width="12" height="104"/><rect x="626" y="470" width="12" height="104"/>
      <rect x="788" y="470" width="12" height="104"/><rect x="950" y="470" width="12" height="104"/>
    </g>
  </g>

  <g fill="#e9d5ff" opacity=".5">
    <circle cx="120" cy="516" r="2.6"/><circle cx="250" cy="552" r="2.2"/>
    <circle cx="760" cy="538" r="2.4"/><circle cx="880" cy="580" r="2"/>
  </g>

  <rect width="1000" height="620" fill="url(#vinheta)"/>
</svg>
