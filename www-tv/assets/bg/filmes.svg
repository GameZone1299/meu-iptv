<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sala" cx=".5" cy=".34" r=".85">
      <stop offset="0" stop-color="#5b1e94"/><stop offset=".42" stop-color="#2a0f4d"/>
      <stop offset="1" stop-color="#08040f"/>
    </radialGradient>
    <linearGradient id="tela" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#f5e9ff"/><stop offset=".35" stop-color="#c084fc"/>
      <stop offset=".72" stop-color="#8b3dff"/><stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="feixe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d5ff" stop-opacity=".30"/>
      <stop offset=".65" stop-color="#c084fc" stop-opacity=".10"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="brilho" cx=".5" cy=".5">
      <stop offset="0" stop-color="#e9d5ff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="assento" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1d63"/><stop offset="1" stop-color="#160a28"/>
    </linearGradient>
    <linearGradient id="fita" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a0b2e"/><stop offset=".5" stop-color="#2c1348"/>
      <stop offset="1" stop-color="#1a0b2e"/>
    </linearGradient>
    <radialGradient id="vinheta" cx=".5" cy=".42" r=".72">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".82"/>
    </radialGradient>
    <filter id="suave"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <rect width="1000" height="620" fill="url(#sala)"/>
  <ellipse cx="500" cy="250" rx="380" ry="210" fill="url(#brilho)" opacity=".5" filter="url(#suave)"/>

  <!-- feixes do projetor -->
  <g opacity=".85">
    <path d="M498 12 L505 12 L742 300 L262 300 Z" fill="url(#feixe)"/>
    <path d="M470 300 L530 300 L880 620 L120 620 Z" fill="url(#feixe)" opacity=".45"/>
  </g>

  <!-- tela de cinema -->
  <rect x="196" y="74" width="608" height="300" rx="10" fill="#0a0416" stroke="#a855f755" stroke-width="2"/>
  <rect x="208" y="86" width="584" height="276" rx="6" fill="url(#tela)" opacity=".92"/>
  <rect x="208" y="86" width="584" height="276" rx="6" fill="#fff" opacity=".06"/>
  <!-- cena projetada na tela -->
  <g opacity=".30" fill="#1a0a2e">
    <circle cx="660" cy="180" r="46"/>
    <path d="M208 362 C300 268 372 300 452 236 C520 182 588 232 660 196 C720 166 764 200 792 178 L792 362 Z"/>
  </g>
  <g opacity=".13" stroke="#fff" stroke-width="1.4">
    <path d="M208 200 H792"/><path d="M208 250 H792"/><path d="M208 300 H792"/>
  </g>

  <!-- barra de faixas/digital -->
  <rect x="0" y="404" width="1000" height="40" fill="url(#fita)" opacity=".55"/>
  <g fill="#0e0620" opacity=".9">
    <rect x="30" y="410" width="34" height="28" rx="3"/><rect x="92" y="410" width="34" height="28" rx="3"/>
    <rect x="154" y="410" width="34" height="28" rx="3"/><rect x="216" y="410" width="34" height="28" rx="3"/>
    <rect x="278" y="410" width="34" height="28" rx="3"/><rect x="340" y="410" width="34" height="28" rx="3"/>
    <rect x="626" y="410" width="34" height="28" rx="3"/><rect x="688" y="410" width="34" height="28" rx="3"/>
    <rect x="750" y="410" width="34" height="28" rx="3"/><rect x="812" y="410" width="34" height="28" rx="3"/>
    <rect x="874" y="410" width="34" height="28" rx="3"/><rect x="936" y="410" width="34" height="28" rx="3"/>
  </g>

  <!-- poltronas em perspectiva -->
  <g opacity=".95">
    <g fill="url(#assento)">
      <path d="M-10 470 h150 q14 0 14 14 v76 q0 14-14 14 H-10 Z"/>
      <path d="M152 470 h150 q14 0 14 14 v76 q0 14-14 14 H152 Z"/>
      <path d="M314 470 h150 q14 0 14 14 v76 q0 14-14 14 H314 Z"/>
      <path d="M476 470 h150 q14 0 14 14 v76 q0 14-14 14 H476 Z"/>
      <path d="M638 470 h150 q14 0 14 14 v76 q0 14-14 14 H638 Z"/>
      <path d="M800 470 h150 q14 0 14 14 v76 q0 14-14 14 H800 Z"/>
      <path d="M962 470 h60 v104 h-60 Z"/>
