<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0618"/><stop offset=".5" stop-color="#230f3f"/>
      <stop offset="1" stop-color="#08040f"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".45">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".3"/>
      <stop offset=".6" stop-color="#7c3aed" stop-opacity=".1"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1a63"/><stop offset=".5" stop-color="#22103c"/>
      <stop offset="1" stop-color="#140823"/>
    </linearGradient>
    <linearGradient id="vidro" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#c084fc" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#7c3aed" stop-opacity=".32"/>
      <stop offset="1" stop-color="#2a0f4d" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="cena" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0abfc"/><stop offset=".5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="luz" cx=".5" cy=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vinheta" cx=".5" cy=".45" r=".75">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".85"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="1000" height="620" fill="url(#fundo)"/>
  <ellipse cx="500" cy="300" rx="420" ry="250" fill="url(#halo)"/>

  <!-- luz ambiente no chão -->
  <ellipse cx="500" cy="540" rx="330" ry="46" fill="url(#luz)" opacity=".18" filter="url(#blur)"/>

  <!-- TV principal -->
  <g>
    <rect x="286" y="140" width="428" height="270" rx="18" fill="url(#tv)" stroke="#a855f766" stroke-width="2.5"/>
    <rect x="304" y="158" width="392" height="234" rx="9" fill="#08040f"/>
    <rect x="304" y="158" width="392" height="234" rx="9" fill="url(#vidro)"/>
    <!-- cena dentro da tela -->
    <g opacity=".8">
      <rect x="304" y="158" width="392" height="234" rx="9" fill="url(#cena)" opacity=".28"/>
      <path d="M304 322 C370 250 428 288 486 234 C548 178 602 232 696 196 L696 392 L304 392 Z" fill="#1d0a34" opacity=".55"/>
      <circle cx="616" cy="212" r="30" fill="#f5e9ff" opacity=".5"/>
    </g>
    <!-- reflexo do vidro -->
    <path d="M304 158 L520 158 L392 392 L304 392 Z" fill="#fff" opacity=".045"/>
    <g opacity=".18" stroke="#fff" stroke-width="1.2">
      <path d="M304 214 H696"/><path d="M304 270 H696"/><path d="M304 326 H696"/>
    </g>
    <!-- moldura brilho -->
    <path d="M286 176 q0-36 36-36 h30" fill="none" stroke="#e9d5ff" stroke-width="3" opacity=".55" stroke-linecap="round"/>
    <!-- pé da TV -->
    <path d="M470 410 h60 l14 26 h-88 Z" fill="#1b0d31"/>
    <rect x="376" y="436" width="248" height="12" rx="6" fill="#241341"/>
    <rect x="376" y="436" width="248" height="4" rx="2" fill="#4c2a7d" opacity=".6"/>
    <!-- LED de standby -->
    <circle cx="500" cy="404" r="3.2" fill="#f472b6" opacity=".9"/>
  </g>

  <!-- TVs menores ao fundo -->
  <g opacity=".55">
    <rect x="112" y="212" width="132" height="86" rx="8" fill="#170a2a" stroke="#7c3aed66" stroke-width="1.6"/>
    <rect x="120" y="220" width="116" height="70" rx="4" fill="url(#cena)" opacity=".35"/>
    <rect x="756" y="196" width="150" height="96" rx="8" fill="#170a2a" stroke="#7c3aed66" stroke-width="1.6"/>
    <rect x="764" y="204" width="134" height="80" rx="4" fill="url(#cena)" opacity=".32"/>
    <rect x="800" y="182" width="70" height="48" rx="6" fill="#170a2a" stroke="#7c3aed55" stroke-width="1.4" opacity=".8"/>
  </g>

  <!-- partículas -->
  <g fill="#e9d5ff">
    <circle cx="176" cy="120" r="2.4" opacity=".55"/><circle cx="842" cy="330" r="2" opacity=".45"/>
    <circle cx="700" cy="76" r="1.8" opacity=".5"/><circle cx="268" cy="486" r="2.2" opacity=".4"/>
    <circle cx="930" cy="140" r="2.6" opacity=".35"/><circle cx="96" cy="378" r="1.8" opacity=".4"/>
  </g>

  <rect width="1000" height="620" fill="url(#vinheta)"/>
</svg>
