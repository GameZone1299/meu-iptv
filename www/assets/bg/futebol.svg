<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05131f"/><stop offset=".55" stop-color="#07202b"/>
      <stop offset="1" stop-color="#04140f"/>
    </linearGradient>
    <linearGradient id="grama" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12603f"/><stop offset=".45" stop-color="#0d4b31"/>
      <stop offset="1" stop-color="#072a1c"/>
    </linearGradient>
    <linearGradient id="campo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b7a51"/><stop offset="1" stop-color="#0c3d28"/>
    </linearGradient>
    <radialGradient id="refletor" cx=".5" cy=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset=".35" stop-color="#d9f99d" stop-opacity=".22"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hazek" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9f99d" stop-opacity=".18"/>
      <stop offset="1" stop-color="#d9f99d" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bola" cx=".34" cy=".3">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#8f9db1"/>
    </radialGradient>
    <radialGradient id="vinheta" cx=".5" cy=".45" r=".75">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".85"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1000" height="620" fill="url(#ceu)"/>

  <!-- arquibancada -->
  <g opacity=".9">
    <rect x="0" y="0" width="1000" height="212" fill="#08161a"/>
    <g fill="#0d2027">
      <rect x="0" y="30" width="1000" height="16"/><rect x="0" y="62" width="1000" height="16"/>
      <rect x="0" y="94" width="1000" height="16"/><rect x="0" y="126" width="1000" height="16"/>
      <rect x="0" y="158" width="1000" height="16"/><rect x="0" y="190" width="1000" height="16"/>
    </g>
    <!-- torcida -->
    <g fill="#a3e635" opacity=".16">
      <circle cx="60" cy="38" r="4"/><circle cx="128" cy="40" r="4"/><circle cx="196" cy="36" r="4"/>
      <circle cx="264" cy="41" r="4"/><circle cx="332" cy="37" r="4"/><circle cx="400" cy="40" r="4"/>
      <circle cx="468" cy="36" r="4"/><circle cx="536" cy="41" r="4"/><circle cx="604" cy="37" r="4"/>
      <circle cx="672" cy="40" r="4"/><circle cx="740" cy="36" r="4"/><circle cx="808" cy="41" r="4"/>
      <circle cx="876" cy="37" r="4"/><circle cx="944" cy="40" r="4"/>
      <circle cx="94" cy="70" r="4"/><circle cx="162" cy="72" r="4"/><circle cx="230" cy="68" r="4"/>
      <circle cx="298" cy="73" r="4"/><circle cx="366" cy="69" r="4"/><circle cx="434" cy="72" r="4"/>
      <circle cx="502" cy="68" r="4"/><circle cx="570" cy="73" r="4"/><circle cx="638" cy="69" r="4"/>
      <circle cx="706" cy="72" r="4"/><circle cx="774" cy="68" r="4"/><circle cx="842" cy="73" r="4"/>
      <circle cx="910" cy="69" r="4"/><circle cx="978" cy="72" r="4"/>
    </g>
    <!-- faixas de publicidade -->
    <rect x="0" y="212" width="1000" height="34" fill="#0a2a21"/>
    <g fill="#a3e635" opacity=".22">
      <rect x="40" y="222" width="120" height="14" rx="3"/><rect x="230" y="222" width="90" height="14" rx="3"/>
      <rect x="380" y="222" width="150" height="14" rx="3"/><rect x="590" y="222" width="110" height="14" rx="3"/>
      <rect x="760" y="222" width="170" height="14" rx="3"/>
    </g>
  </g>

  <!-- refletores -->
  <g>
    <path d="M330 0 L352 0 L470 300 L300 300 Z" fill="url(#hazek)" opacity=".55"/>
    <path d="M648 0 L670 0 L720 300 L550 300 Z" fill="url(#hazek)" opacity=".55"/>
    <ellipse cx="340" cy="26" rx="86" ry="60" fill="url(#refletor)" filter="url(#glow)"/>
    <ellipse cx="660" cy="26" rx="86" ry="60" fill="url(#refletor)" filter="url(#glow)"/>
    <g fill="#0a1a16">
      <rect x="286" y="8" width="108" height="26" rx="6"/><rect x="608" y="8" width="108" height="26" rx="6"/>
    </g>
    <g fill="#f7fee7" opacity=".85">
      <rect x="296" y="14" width="20" height="14" rx="2"/><rect x="322" y="14" width="20" height="14" rx="2"/>
      <rect x="348" y="14" width="20" height="14" rx="2"/><rect x="374" y="14" width="12" height="14" rx="2"/>
      <rect x="618" y="14" width="20" height="14" rx="2"/><rect x="644" y="14" width="20" height="14" rx="2"/>
      <rect x="670" y="14" width="20" height="14" rx="2"/><rect x="696" y="14" width="12" height="14" rx="2"/>
    </g>
    <!-- torres -->
    <rect x="330" y="-6" width="6" height="26" fill="#0a1a16"/>
    <rect x="652" y="-6" width="6" height="26" fill="#0a1a16"/>
  </g>

  <!-- gramado em perspectiva -->
  <path d="M0 246 H1000 L1000 620 H0 Z" fill="url(#grama)"/>
  <g opacity=".55">
    <path d="M110 246 L-70 620 H120 L232 246 Z" fill="#0f5436"/>
    <path d="M340 246 L300 620 H420 L400 246 Z" fill="#0f5436"/>
    <path d="M600 246 L580 620 H700 L660 246 Z" fill="#0f5436"/>
    <path d="M860 246 L960 620 H1080 L1000 246 Z" fill="#0f5436"/>
  </g>

  <!-- linhas do campo -->
  <g fill="none" stroke="#eaffd0" stroke-opacity=".42" stroke-width="3">
    <path d="M96 620 L300 300 H700 L904 620 Z"/>
    <path d="M420 620 L472 430 H528 L580 620"/>
    <path d="M300 300 H700"/>
  </g>
  <ellipse cx="500" cy="300" rx="58" ry="16" fill="none" stroke="#eaffd0" stroke-opacity=".42" stroke-width="3"/>

  <!-- bola em destaque -->
  <g>
    <ellipse cx="500" cy="470" rx="96" ry="26" fill="#000" opacity=".38" filter="url(#soft)"/>
    <circle cx="500" cy="376" r="94" fill="url(#bola)"/>
    <g fill="#0e1a24" opacity=".9">
      <path d="M500 314 L536 340 L522 382 H478 L464 340 Z"/>
      <path d="M590 356 L600 398 L568 424 L534 404 L540 366 Z" opacity=".75"/>
      <path d="M410 356 L460 366 L466 404 L432 424 L400 398 Z" opacity=".75"/>
      <path d="M500 444 L536 430 L548 452 L500 470 L452 452 L464 430 Z" opacity=".7"/>
    </g>
    <g fill="none" stroke="#94a3b8" stroke-width="2.6" opacity=".55">
      <path d="M406 376 q94 46 188 0"/>
      <path d="M414 336 q86-38 172 0"/>
    </g>
    <ellipse cx="470" cy="336" rx="42" ry="26" fill="#fff" opacity=".4" filter="url(#soft)"/>
  </g>

  <rect width="1000" height="620" fill="url(#vinheta)"/>
</svg>
